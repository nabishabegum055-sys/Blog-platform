{% extends "base.html" %}
{% block content %}

<div class="col-md-6 mx-auto">
<div class="card p-4 shadow">

<h3>Create Blog</h3>

<form method="POST">
<input class="form-control mb-3" name="title" placeholder="Title">
<input class="form-control mb-3" name="image" placeholder="Image URL">
<textarea class="form-control mb-3" name="content"></textarea>
<button class="btn btn-success w-100">Publish</button>
</form>

</div>
</div>

{% endblock %}
